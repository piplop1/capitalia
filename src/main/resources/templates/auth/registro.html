<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" th:href="@{/css/index.css}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Signika+Negative&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Registro - Capitalia</title>
</head>
<body><nav class="main-nav" th:replace="layouts/fragmentos:: navbarPrincipal "></nav>
 <main class="main-registro">
        <section class="registration-section">
            <div class="registration-form-container">
                <h2><i class="fas fa-user-plus"></i> Crea tu Cuenta en Capitalia</h2>
                <p>Únete a la revolución del ahorro digital. Es rápido, fácil y seguro.</p>
                
                <!-- Añadimos un ID para que el JavaScript pueda encontrar el formulario -->
                <form id="registration-form" class="registration-form" th:action="@{/registro}" method="post">
                    <!-- Campo de Correo Electrónico -->
                    <div class="form-group">
                        <label for="fullname">Nombre Completo</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Tu nombre y apellido" required>
                    </div>

                    <!-- Campo de Correo Electrónico -->
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="tu.correo@ejemplo.com" required>
                    </div>

                    <!-- Campo de Contraseña -->
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <!-- Requisitos de la Contraseña -->
                    <ul class="password-requirements">
                        <li><i class="fas fa-check-circle"></i> Al menos una letra mayúscula (A-Z).</li>
                        <li><i class="fas fa-check-circle"></i> Al menos un número (0-9).</li>
                        <li><i class="fas fa-check-circle"></i> Al menos un carácter especial (ej: @, ?, !).</li>
                    </ul>

                    <!-- Checkbox de Términos y Condiciones -->
                    <div class="form-group terms-group">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">Acepto los <a href="/terminos" target="_blank">Términos y Condiciones</a></label>
                    </div>

                    <button type="submit" class="btn-primary">Crear Mi Cuenta</button>
                </form>
            </div>
        </section>
 </main>
 <footer th:replace="layouts/fragmentos :: footer"></footer>
 <script th:src="@{/js/main.js}"></script>
</body>
</html>
